name: Sandbox Drill Push

# Pushes the generated OP-03 native drill to an ISOLATED, standalone Apps
# Script test project so nobody has to move a 137 KB file through a browser
# clipboard. It never deploys anything, never touches the production project
# (the builder rejects the production script ID), and the drill itself refuses
# to run anywhere but the project ID it was built for.
# Default Gate 0 runs the ACTUAL two-stage product entrypoints in an isolated
# script, against three self-created synthetic workbooks. Historical legacy
# five-phase drill stays available via explicit drill_kind: legacy.

on:
  workflow_dispatch:
    inputs:
      sandbox_script_id:
        description: 'Script ID of the standalone ISOLATED test project (never production)'
        required: true
        type: string
      expected_commit:
        description: 'Full 40-character SHA of the candidate being drilled (must equal the dispatched ref)'
        required: true
        type: string
      drill_kind:
        description: 'Which isolated drill to upload (two-stage is required for OP-03 Gate 0)'
        required: true
        type: choice
        default: two-stage
        options:
          - two-stage
          - legacy

concurrency:
  group: sandbox-drill-push
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Refuse anything but the exact candidate and an isolated project
        env:
          SANDBOX_ID: ${{ inputs.sandbox_script_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -eu
          if [ "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Dispatched ref ($GITHUB_SHA) is not the expected candidate ($EXPECTED_COMMIT)."; exit 1
          fi
          prod="$(node -p "require('./.clasp.json').scriptId")"
          if [ -z "$SANDBOX_ID" ] || [ "$SANDBOX_ID" = "$prod" ]; then
            echo "::error::Refusing: the target is empty or is the PRODUCTION script project."; exit 1
          fi
          case "$SANDBOX_ID" in *[!A-Za-z0-9_-]*) echo "::error::Malformed script ID."; exit 1;; esac

      - name: Build the bound drill from this exact source
        env:
          SANDBOX_ID: ${{ inputs.sandbox_script_id }}
        run: |
          set -eu
          mkdir -p /tmp/drill
          case "${{ inputs.drill_kind }}" in
            two-stage)
              node test-support/build-google-two-stage-drill.cjs --script-id "$SANDBOX_ID" | tee drill-metadata.json
              cp test-support/google-two-stage-drill-candidate.gs /tmp/drill/Code.gs
              ;;
            legacy)
              node test-support/build-google-operational-drill.cjs --script-id "$SANDBOX_ID" | tee drill-metadata.json
              cp test-support/google-operational-drill-candidate.gs /tmp/drill/Code.gs
              ;;
            *) echo "::error::Unsupported drill_kind"; exit 1 ;;
          esac
          printf '%s\n' '{"timeZone":"Asia/Jerusalem","exceptionLogging":"STACKDRIVER","runtimeVersion":"V8","oauthScopes":["https://www.googleapis.com/auth/spreadsheets"]}' > /tmp/drill/appsscript.json
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SANDBOX_ID" > /tmp/drill/.clasp.json
          sha256sum /tmp/drill/Code.gs
          if grep -q "$(node -p "require('./.clasp.json').scriptId")" /tmp/drill/Code.gs; then
            echo "::error::Generated drill references the production script ID."; exit 1
          fi
          if [ "${{ inputs.drill_kind }}" = two-stage ]; then
            grep -q 'function nightlyIntegrityJob(' /tmp/drill/Code.gs
            grep -q 'function finalizeNightlyIntegrityJob(' /tmp/drill/Code.gs
          fi

      - name: Verify clasp credential secret is present
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing secret CLASPRC_JSON (same secret the release workflow uses)."; exit 1
          fi

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'))"

      - name: Push the drill to the isolated project (no deploy)
        working-directory: /tmp/drill
        run: clasp push -f

      - name: Summary
        run: |
          {
            echo '## Sandbox drill pushed'
            echo
            echo "Candidate: \`$GITHUB_SHA\`"
            echo
            echo '```json'; cat drill-metadata.json; echo '```'
            echo
            if [ "${{ inputs.drill_kind }}" = two-stage ]; then
              echo 'Next: prepareTwoStageDrill ONCE (creates 3 synthetic workbooks), expandTwoStageInventoryDrill until 350/350, captureTwoStageDrill, verifyTwoStageDrill, restoreTwoStageDrill. Never create sheets/properties manually. Real A/B elapsed times are logged. Manual archives deliberately BLOCK operational cutover.'
            else
              echo 'LEGACY only: prepareOperationalDrill → captureOperationalDrill → restoreOperationalDrill → verifyOperationalDrill → verifyManualTabDrill.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$HOME/.clasprc.json" /tmp/drill/.clasp.json
