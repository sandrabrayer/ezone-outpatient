name: Weekly Healthcheck

# Weekly live healthcheck of the deployed Outpatient app (Railway) — runs every
# Saturday evening Israel time and on demand from the Actions tab.
#
# 18:00 UTC Saturday = 21:00 IDT (summer) / 20:00 IST (winter).
#
# Failure semantics:
#   - CRITICAL breakage (shell down, PIN rejected, loadAll endpoint broken,
#     clients schema drift) -> the job fails -> GitHub emails the workflow
#     failure notification.
#   - Data-quality issues (blank ids, malformed dates, no_match SessionLog
#     rows) are WARNINGS in the step summary — the run stays green.
#
# This workflow is schedule/dispatch-only: it never runs on pull requests and
# must NEVER be made a required status check (the repo's required check is the
# `test` job of test.yml). It cannot gate merges.

on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # No npm install: scripts/healthcheck.js uses Node built-ins only.
      - name: Run healthcheck
        env:
          APP_URL: https://ezone-outpatient.up.railway.app
          APP_PIN: ${{ secrets.APP_PIN }}
        run: node scripts/healthcheck.js
