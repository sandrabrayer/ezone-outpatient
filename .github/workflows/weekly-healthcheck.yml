name: Weekly Public Healthcheck

# Public-only service availability, every Saturday evening in Israel.
# Do not fetch real patient, payment, session or source spreadsheet data in CI.
# A separate internal integrity/backup control owns those checks.
# 18:00 UTC Saturday = 20:00 Israel winter / 21:00 summer.
on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify monitor contracts offline before public requests
        run: node --test test/public-healthcheck.test.js

      - name: Read only public version, health, and HTML shell
        env:
          APP_URL: https://ezone-outpatient.up.railway.app
        run: node scripts/public-healthcheck.js

      - name: Explain monitor scope
        if: always()
        run: |
          echo "Public uptime test only. This job does not certify live patient/finance data,"
          echo "the Apps Script source, or the most recent backup."
