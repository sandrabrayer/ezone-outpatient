name: Test

# Runs the Node test suite (node --test) on every pull request and on every
# push to main, so a change that breaks server routes, billing/renewal logic,
# or the shared-secret cross-app endpoints is caught before it merges/deploys.
#
# The suite mocks all external HTTP (global.fetch is stubbed and Apps Script
# logic is mirrored) — it never calls the live Google Apps Script backends.

on:
  push:
    branches:
      - claude/youthful-volta-laarnk
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  lead-save-browser:
    # Pinned (2026-11-16): `ubuntu-latest` moved to Ubuntu 26.04, for which the
    # pinned Playwright 1.51.1 has no chromium-headless-shell build — the browser
    # install failed before any test ran. Move this together with the Playwright pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install application dependencies
        run: npm ci

      # Browser tooling is test-only, separately pinned and outside the app's
      # dependency tree. Tests allow browser traffic only to their local server.
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/ezone-browser-tools --no-save --package-lock=false playwright@1.51.1
          node /tmp/ezone-browser-tools/node_modules/playwright/cli.js install --with-deps chromium --only-shell

      - name: Run real UI, financial and complete workflow scenarios
        env:
          NODE_PATH: /tmp/ezone-browser-tools/node_modules
          EZONE_REQUIRE_BROWSER_TESTS: '1'
        run: node --test --test-concurrency=1 test/lead-save-browser.test.js test/financial-save-browser.test.js test/protected-price-browser.test.js test/package-calculator-browser.test.js test/money-scope-browser.test.js test/crm-activity-browser.test.js test/package-change-save-browser.test.js test/read-only-boot-browser.test.js test/continuation-crm-browser.test.js test/plan-types-save-browser.test.js test/one-time-lead-browser.test.js test/session-notice-outcome-browser.test.js test/offers-crm-browser.test.js test/crm-followup-2-browser.test.js test/one-time-session-browser.test.js test/out-workflow-acceptance-browser.test.js
